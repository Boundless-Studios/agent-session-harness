[project]
name = "agent-session-harness"
version = "0.3.0"
description = "Crash-safe context accounting and fresh-session supervision for Claude Code and Codex."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Boundless Studios" }]
dependencies = [
  # Keep this exact immutable tag aligned with Gaia and agentic-pr-dash. v0.5.0
  # adds the fenced local-command lease runner without changing harness APIs.
  "agent-coordinator @ git+https://github.com/Boundless-Studios/agent-coordinator.git@v0.5.0",
  "platformdirs>=4,<5",
  "pydantic>=2.11,<3",
]

[project.scripts]
agent-session-harness = "agent_session_harness.cli:main"

[project.optional-dependencies]
dev = ["build>=1", "httpx>=0.27,<1", "pytest>=8", "ruff>=0.12"]
# The beads checkpoint adapter shells out to the `bd` CLI and pulls in no
# Python packages; the extra exists to declare that runtime requirement.
beads = []
linear = ["httpx>=0.27,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_session_harness"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff.lint]
# TRY004: ValueError for JSON format validation is intentional — the input is
# text, not a type mismatch.  BLE001: broad exception catches are deliberate
# resiliency patterns in async/out-of-process code.  RUF009: Path.cwd() in
# dataclass defaults captures caller context at instantiation time.  SIM117:
# nested with statements for HTTP streams have correct error scoping.
ignore = ["TRY004", "BLE001", "RUF009", "SIM117"]
